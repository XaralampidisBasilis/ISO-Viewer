<div id="debug-struct-layouts">
  <div class="viz-carousel viz-dotted-background" aria-label="Debug layouts matching Rendering">
    <section data-variant="Stacked fields"><div class="preview" data-layout="stacked"></div></section>
    <section data-variant="Inline rows" hidden><div class="preview" data-layout="inline"></div></section>
    <section data-variant="Grouped fields" hidden><div class="preview" data-layout="grouped"></div></section>
    <section data-variant="Two columns" hidden><div class="preview" data-layout="columns"></div></section>
    <section data-variant="Active first" hidden><div class="preview" data-layout="active"></div></section>
  </div>
</div>
<style>
  #debug-struct-layouts [hidden] { display:none !important; }
  #debug-struct-layouts .preview {
    --paper: light-dark(#e8e7df,#232932);
    --field: light-dark(#f1f0e9,#1a2027);
    --ink: light-dark(#172d41,#e6edf4);
    --label: light-dark(#36566e,#b1becb);
    --line: light-dark(#9b9f9e,#505f70);
    --selected: light-dark(#dceaf7,#304a64);
    display:grid; justify-items:center; align-content:start; min-height:1080px;
    padding:16px 12px; color:var(--ink); font:13px/1.4 system-ui,sans-serif;
  }
  #debug-struct-layouts .preview * { box-sizing:border-box; }
  #debug-struct-layouts .panel { width:min(var(--panel-width,280px),100%); padding:12px; display:grid; gap:10px; border:1px solid var(--line); background:var(--paper); }
  #debug-struct-layouts h3 { margin:0; font-size:15px; }
  #debug-struct-layouts h4 { margin:0; font-size:12px; color:var(--label); font-weight:600; }
  #debug-struct-layouts .check { display:flex; gap:7px; align-items:center; color:var(--label); font-size:12px; }
  #debug-struct-layouts input { margin:0; accent-color:light-dark(#294b69,#a6ccef); }
  #debug-struct-layouts .fields, #debug-struct-layouts .group { display:grid; gap:10px; min-width:0; }
  #debug-struct-layouts .field { display:grid; gap:4px; min-width:0; color:var(--label); font-size:12px; }
  #debug-struct-layouts select { width:100%; min-width:0; padding:5px 7px; border:1px solid var(--line); border-radius:0; color:var(--ink); background:var(--field); font:13px system-ui,sans-serif; }
  #debug-struct-layouts .status { margin:0; color:var(--label); font-size:12px; }
  #debug-struct-layouts [data-layout=inline] .field { grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); align-items:center; gap:8px; }
  #debug-struct-layouts [data-layout=inline] .fields { gap:8px; }
  #debug-struct-layouts [data-layout=grouped] .group + .group { border-top:1px solid var(--line); padding-top:10px; }
  #debug-struct-layouts [data-layout=columns] .fields { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 8px; }
  #debug-struct-layouts [data-layout=active] .field.is-active { padding-bottom:10px; border-bottom:1px solid var(--line); }
  @media (pointer:coarse) {
    #debug-struct-layouts .preview { min-height:1280px; }
    #debug-struct-layouts select, #debug-struct-layouts .check { min-height:44px; }
    #debug-struct-layouts select { font-size:16px; }
  }
</style>
<script>
(() => {
  const root=document.getElementById('debug-struct-layouts');
  const structs={
    'Surface hit':['Distance','Position','Residue','Gradient'],
    'Traversal counters':['Cells traversed','Blocks traversed','Texture fetches','Root solves','Bernstein rejections'],
    'Ray':['Direction','Signs','Start distance','End distance'],
    'Blocks':['Occupancy map','Skip coordinates','Coordinates','Entry distance'],
    'Cells':['Intersected','Coordinates','Entry distance'],
    'Traces':['Distance','Position','Residue'],
    'Lighting':['Material color','Ambient color','Diffuse color','Specular color'],
    'Volume bounds':['Entry distance','Exit distance','Min position','Max position'],
    'Camera':['Position','Direction'],
    'Cubic':['Root','Number of roots','Degree','Bernstein weights'],
    'Quintic':['Root','Number of roots','Degree','Bernstein weights'],
    'Custom variables':['Variable 0','Variable 1','Variable 2']
  };
  const groups={
    'Surface and lighting':['Surface hit','Lighting'],
    'Traversal':['Traversal counters','Ray','Blocks','Cells','Traces'],
    'Spatial':['Volume bounds','Camera'],
    'Polynomials and custom':['Cubic','Quintic','Custom variables']
  };
  for (const preview of root.querySelectorAll('.preview')) {
    const layout=preview.dataset.layout;
    preview.innerHTML='<section class="panel" aria-label="'+preview.parentElement.dataset.variant+' Debug panel">'+
      '<h3>Debug</h3><label class="check"><input type="checkbox" checked data-enabled> Enable debug</label>'+
      '<div class="fields" data-fields></div><p class="status" aria-live="polite"></p></section>';
    const fields=preview.querySelector('[data-fields]');
    const rows=new Map();
    for (const [name,variables] of Object.entries(structs)) {
      const row=document.createElement('label');
      row.className='field';
      const text=document.createElement('span');
      text.textContent=name;
      const select=document.createElement('select');
      const empty=new Option(layout==='columns' || layout==='inline'?'Choose…':'Choose variable','');
      empty.disabled=true;
      select.add(empty);
      for (const variable of variables) select.add(new Option(variable,variable));
      select.value='';
      row.append(text,select);
      rows.set(name,row);
    }
    if (layout==='grouped') {
      for (const [heading,names] of Object.entries(groups)) {
        const group=document.createElement('div');
        group.className='group';
        const title=document.createElement('h4');
        title.textContent=heading;
        group.append(title,...names.map(name=>rows.get(name)));
        fields.append(group);
      }
    } else fields.append(...rows.values());
    let active='Traversal counters';
    let value='Blocks traversed';
    const render=()=>{
      const enabled=preview.querySelector('[data-enabled]').checked;
      fields.hidden=!enabled;
      for (const [name,row] of rows) {
        row.querySelector('select').value=name===active?value:'';
        row.classList.toggle('is-active',name===active);
      }
      if (layout==='active') fields.prepend(rows.get(active));
      preview.querySelector('.status').textContent=enabled?'Viewing '+value:'Surface';
    };
    for (const [name,row] of rows) row.querySelector('select').addEventListener('change',event=>{
      active=name; value=event.target.value; render();
    });
    preview.querySelector('[data-enabled]').addEventListener('change',render);
    render();
  }
  if (globalThis.Tweak) {
    const state={width:280};
    const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--panel-width',state.width+'px')});
    tweak.addSlider(state,'width',{label:'Panel width',min:248,max:300,unit:'px'});
  }
})();
</script>
