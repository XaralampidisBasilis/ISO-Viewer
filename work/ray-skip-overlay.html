<div id="ray-skip-overlay">
  <div class="viewport-preview" aria-label="Illustrative distance-map overlay">
    <div class="toolbar"><strong>Ray inspection</strong><span>Illustrative geometry</span></div>
    <canvas aria-label="An oblique view of a ray crossing three empty wireframe regions before hitting a branching surface."></canvas>
    <div class="controls">
      <label><input type="checkbox" data-ray checked> Ray path</label>
      <label><input type="checkbox" data-boxes checked> Skip regions</label>
      <label class="opacity">Opacity <input type="range" min="10" max="90" value="35" data-opacity><output>35%</output></label>
    </div>
    <div class="legend"><span><i class="ray-mark"></i>Selected ray</span><span><i class="box-mark"></i>Empty skip region</span><span><i class="hit-mark"></i>First surface hit</span></div>
  </div>
</div>
<style>
  #ray-skip-overlay { color-scheme:light; font:13px/1.4 system-ui,sans-serif; color:#243c4b; }
  #ray-skip-overlay .viewport-preview { background:#eeeee7; border:1px solid #aab2b1; }
  #ray-skip-overlay .toolbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:10px 12px; border-bottom:1px solid #c6ccc7; }
  #ray-skip-overlay .toolbar span { color:#586b75; font-size:12px; }
  #ray-skip-overlay canvas { display:block; width:100%; height:400px; }
  #ray-skip-overlay .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:10px 12px; border-top:1px solid #c6ccc7; }
  #ray-skip-overlay label { display:flex; align-items:center; gap:6px; }
  #ray-skip-overlay input { accent-color:#38677b; }
  #ray-skip-overlay .opacity input { width:90px; }
  #ray-skip-overlay output { width:4ch; font-variant-numeric:tabular-nums; }
  #ray-skip-overlay .legend { display:flex; flex-wrap:wrap; gap:9px 20px; padding:0 12px 12px; font-size:12px; color:#48616b; }
  #ray-skip-overlay .legend span { display:flex; gap:6px; align-items:center; }
  #ray-skip-overlay .legend i { display:inline-block; width:12px; height:12px; box-sizing:border-box; }
  #ray-skip-overlay .ray-mark { height:2px !important; background:#a86920; }
  #ray-skip-overlay .box-mark { border:1px solid #368794; background:#d3e6e3; }
  #ray-skip-overlay .hit-mark { border-radius:50%; background:#ad473e; }
  @media(max-width:460px) { #ray-skip-overlay canvas { height:350px; } }
  @media(pointer:coarse) { #ray-skip-overlay label { min-height:44px; } }
</style>
<script>
(() => {
  const root=document.getElementById('ray-skip-overlay');
  const canvas=root.querySelector('canvas');
  const context=canvas.getContext('2d');
  const ray=root.querySelector('[data-ray]');
  const boxes=root.querySelector('[data-boxes]');
  const opacity=root.querySelector('[data-opacity]');
  const edges=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  function draw() {
    const width=canvas.clientWidth,height=canvas.clientHeight,ratio=devicePixelRatio||1;
    canvas.width=width*ratio;canvas.height=height*ratio;
    context.setTransform(ratio,0,0,ratio,0,0);
    context.clearRect(0,0,width,height);
    const scale=Math.min((width-48)/6.5,(height-85)/4.2);
    const project=([x,y,z])=>[width*.50+scale*(x*.83+y*.46),height*.55+scale*(x*.24-y*.30-z*.85)];
    const line=(a,b,color,thickness=1,dash=[])=>{
      context.beginPath();context.strokeStyle=color;context.lineWidth=thickness;context.setLineDash(dash);
      context.moveTo(...project(a));context.lineTo(...project(b));context.stroke();context.setLineDash([]);
    };
    const dot=(position,color,radius)=>{
      context.beginPath();context.fillStyle=color;context.arc(...project(position),radius,0,Math.PI*2);context.fill();
    };
    const cube=(lo,hi,color,fill)=>{
      const points=Array.from({length:8},(_,i)=>[i&1?hi[0]:lo[0],i&2?hi[1]:lo[1],i&4?hi[2]:lo[2]]);
      if(fill) {
        for(const face of [[0,1,3,2],[0,1,5,4],[1,3,7,5]]) {
          context.beginPath();context.fillStyle=fill;
          face.forEach((index,i)=>{const p=project(points[index]);if(i===0)context.moveTo(...p);else context.lineTo(...p);});
          context.closePath();context.fill();
        }
      }
      for(const [a,b] of edges)line(points[a],points[b],color);
    };
    const text=(label,x,y,color='#48616b',align='left')=>{
      context.font='12px system-ui,sans-serif';context.fillStyle=color;context.textAlign=align;context.fillText(label,x,y);
    };
    cube([-2,-1.2,-1.35],[2,1.2,1.35],'#bbc5c2');
    // A stylized branching surface provides visual context for the selected hit.
    const paths=[
      [[1.43,0,-1.1],[1.43,0,-.5],[1.43,0,0],[1.43,0,.55],[1.2,0,1.2]],
      [[1.43,0,.1],[1.50,.35,.45],[1.8,.55,.85]],
      [[1.43,0,-.2],[1.65,-.35,-.6],[1.8,-.65,-1.1]]
    ];
    for(const path of paths) {
      for(const [thickness,color] of [[scale*.44,'#788c8e'],[scale*.31,'#aab8b1'],[scale*.16,'#c8d0c4']]) {
        context.beginPath();context.strokeStyle=color;context.lineWidth=thickness;context.lineCap='round';context.lineJoin='round';
        path.forEach((point,index)=>{const p=project(point);if(index===0)context.moveTo(...p);else context.lineTo(...p);});
        context.stroke();
      }
    }
    context.lineCap='butt';
    const alpha=Number(opacity.value)/100;
    if(boxes.checked) {
      const regions=[[-2,-.9,.54],[-.9,.1,.44],[.1,.85,.29]];
      regions.forEach(([start,end,radius],index)=>{
        cube([start,-radius,-radius],[end,radius,radius],`rgba(28,115,132,${Math.min(.95,alpha+.25)})`,`rgba(74,169,178,${alpha*.20})`);
        const label=project([(start+end)/2,0,radius]);
        text('Skip '+(index+1),label[0],label[1]-12,'#276d79','center');
      });
    }
    if(ray.checked) {
      line([-3,0,0],[-2,0,0],'#a86920',1.7,[5,4]);
      line([-2,0,0],[1.21,0,0],'#a86920',2);
      for(const x of [-2,-.9,.1,.85])dot([x,0,0],'#a86920',3);
      dot([-3,0,0],'#435f6c',4);
      const camera=project([-3,0,0]);
      text('Camera ray',camera[0],camera[1]-17,'#72542d');
      const near=project([1.03,0,0]);
      text('Fine traversal',near[0],near[1]+30,'#72542d','center');
    }
    dot([1.21,0,0],'#ad473e',4.5);
    const hit=project([1.21,0,0]);
    context.beginPath();context.strokeStyle='#ad473e';context.lineWidth=1;
    context.moveTo(hit[0]+5,hit[1]-5);context.lineTo(hit[0]+27,hit[1]-29);context.stroke();
    text('First hit',hit[0]+30,hit[1]-30,'#963e37');
    root.querySelector('output').value=opacity.value+'%';
  }
  for(const control of [ray,boxes,opacity])control.addEventListener('input',draw);
  new ResizeObserver(draw).observe(canvas);
  draw();
})();
</script>
